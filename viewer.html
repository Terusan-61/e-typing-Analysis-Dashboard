<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>e-typing Analyzer</title>
    <style>
        /* ... (以前のCSSはそのまま) ... */
        
        /* 小さい切り替えボタン用 */
        .mini-tab {
            padding: 5px 15px;
            font-size: 12px;
            background: #16213e;
            color: #aaa;
            border: 1px solid #2a2a4e;
            border-radius: 15px;
            cursor: pointer;
        }
        .mini-tab:hover { background: #1f2f58; color: white; }
        .mini-tab.active {
            background: #0f3460;
            color: white;
            border-color: #4a90e2;
            font-weight: bold;
        }

        /* タブのスタイル */
        .view-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .view-tabs button {
            flex: 1;
            padding: 12px;
            background: #16213e;
            color: #aaa;
            border: 1px solid #2a2a4e;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .view-tabs button:hover { background: #1f2f58; color: white; }
        .view-tabs button.active {
            background: #e94560; /* アクティブ時は赤系 */
            color: white;
            border-color: #e94560;
        }

        body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; background-color: #1a1a2e; color: #fff; } /* TETR.IOっぽく背景を暗くしてみましょう！ */
        h1 { color: #fff; text-align: center; }
        
        /* コントロールエリア */
        .controls { background: #16213e; padding: 20px; border-radius: 8px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; color: #fff; }
        select, input { padding: 10px; border: 1px solid #0f3460; background: #0f3460; color: white; border-radius: 4px; font-size: 16px; }
        .stats-box { background: #0f3460; padding: 10px 20px; border-radius: 4px; border-left: 5px solid #e94560; }
        
        /* テーブル装飾 (ダークモード対応) */
        table { width: 100%; border-collapse: collapse; background: #16213e; color: #fff; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a2a4e; }
        th { background-color: #0f3460; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #1f2f58; }

        /* ランクバッジ (テーブル用) */
        .rank-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
            min-width: 40px;
            text-align: center;
        }

        /* ゲージ周りのスタイル調整 */
        .gauge-wrapper {
            background-color: #000;
            border-radius: 8px;
            padding: 5px; /* 内側に少し余白を作る */
            margin-bottom: 5px; /* 下の目盛りとの間隔 */
        }
        
        .gauge-main {
            width: 100%;
            height: 50px; /* メインは太く */
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            position: relative;
            margin-bottom: 2px; /* サブとの隙間 */
        }

        .gauge-sub {
            width: 100%;
            height: 25px; /* サブは細く */
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            position: relative;
            opacity: 0.9;
        }

        /* ゲージ (Rank Gauge) のスタイル */
        
        .gauge-segment {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-right: 1px solid rgba(0,0,0,0.3);
            transition: width 0.5s ease;
            position: relative;
        }
        .gauge-label { font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px black; z-index: 2; }
        .gauge-score { font-size: 10px; color: rgba(255,255,255,0.8); z-index: 2; }
        
        /* ゲージの下にある目盛り（最小0 - 最大スコア） */
        .gauge-axis {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 12px;
            margin-top: 0px;
            margin-bottom: 20px;
            padding: 0 5px;
        }
    </style>
</head>
<body>
    <h1>📊 e-typing Analysis Dashboard</h1>

    <div class="controls">
        <select id="roundSelect">
            <option value="">開催回を選択してください...</option>
        </select>
        <input type="text" id="searchInput" placeholder="ユーザー名で検索...">
        
        <div class="stats-box" id="roundStats">
            平均: - | 参加人数: -
        </div>
    </div>

    <div class="gauge-controls" style="display: flex; gap: 10px; margin-bottom: 5px;">
        <span style="font-size: 14px; color: #aaa; align-self: center;">ゲージ表示:</span>
        <button id="btnGaugeCustom" class="mini-tab active">独自ランク (スコア幅)</button>
        <button id="btnGaugeOfficial" class="mini-tab">公式レベル (人数幅)</button>
    </div>

    <div class="gauge-wrapper">
        <div id="rankGaugeContainer" class="gauge-main"></div>
        
        <div id="subGaugeContainer" class="gauge-sub"></div>

        <div class="gauge-axis">
            <span id="gaugeAxisLeft">0 pt</span>
            <span id="gaugeAxisRight">Max pt</span>
        </div>
    </div>

    <div class="view-tabs">
        <button id="tabPlayers" class="active">プレイヤーランキング</button>
        <button id="tabBreakdown">ランク内訳 (BREAKDOWN)</button>
    </div>

    <div id="playerListContainer">
        <table>
            <thead>
                <tr>
                    <th>順位</th>
                    <th>名前</th>
                    <th>スコア</th>
                    <th>偏差値</th>
                    <th>公式レベル</th>
                    <th>独自ランク(上位%)</th>
                </tr>
            </thead>
            <tbody id="rankingBody">
                </tbody>
        </table>
    </div>

    <div id="rankBreakdownContainer" style="display: none;">
        <table>
            <thead>
                <tr>
                    <th>ランク</th>
                    <th>必要スコア (境界)</th>
                    <th>人数</th>
                    <th>最低順位</th>
                    <th>最低偏差値</th>
                </tr>
            </thead>
            <tbody id="breakdownBody">
                </tbody>
        </table>
    </div>

    <script src="viewer.js"></script>
</body>
</html>
